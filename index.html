<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uniMatch Mock</title>
  <style>
    :root {
      --bg: #f8f7f5;          /* 배경색 */
      --gray-box: #dddddd;    /* 회색 박스 */
      --teal: #4b9fa8;        /* 청록색 박스 */
      --ink: #24323a;
      --muted: #6b7b83;
      --white: #ffffff;
      --radius-xl: 18px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      margin: 0;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }
    button { font: inherit; border: none; background: none; cursor: pointer; padding: 0; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

    /* 헤더 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 0; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
    .logo img { width: 100px; height: 80px; }
    .search-area { display: flex; gap: 8px; align-items: center; flex-grow: 1; max-width: 370px; }
    .searchbar { display: flex; flex: 1; height: 38px; border-radius: 19px; border: 1px solid #cfd8dc; background: var(--white); overflow: hidden; }
    .searchbar input { flex: 1; border: none; padding: 0 16px; background: transparent; outline: none; }
    .searchbar button { padding: 0 12px; color: #555; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 12px; background: var(--white); border: 1px solid #cfd8dc; font-size: 14px; }
    .chip img { width: 35px; height: 26px; }
    .auth-links { font-size: 14px; color: var(--muted); display: flex; gap: 12px; align-items: center; }

    .main-nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; margin-bottom: 24px; }
    .burger { width: 42px; height: 42px; border: 1px solid #ddd; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
    .burger span { width: 22px; height: 2px; background: #666; position: relative; }
    .burger span::before, .burger span::after { content: ""; position: absolute; left: 0; width: 100%; height: 2px; background: #666; }
    .burger span::before { top: -7px; }
    .burger span::after { top: 7px; }
    .tabs { display: flex; gap: 4px; }
    .tab { background: var(--bg); padding: 10px 18px; border: 1px solid #ddd; border-radius: 8px; font-weight: 500; margin: 0 -1px 0 0; }
    .tab.active { background: var(--bg); font-weight: 600; position: relative; z-index: 1; }
    .user-icon { width: 42px; height: 42px; border: 1px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .user-icon img { width: 24px; height: 24px; }

    /* 그리드 레이아웃 */
    .grid { display: grid; grid-template-columns: 2fr 0.9fr; gap: 18px; align-items: start; }
    .panel { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: stretch; }
    .card { background: var(--gray-box); border-radius: var(--radius-xl); padding: 20px; }

    .school-box { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; }
    .school-btn { width: 100%; background: var(--teal); color: var(--white); font-weight: 800; font-size: 20px; border-radius: 12px; padding: 14px; }

    .center-hero { display: grid; grid-template-rows: auto 1fr; gap: 12px; }
    .logo-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .logo-row img { height: 80px; object-fit: contain; }
    .hero-text { text-align: center; font-weight: 900; font-size: 24px; line-height: 1.35; align-self: center; }

    .login-card { background: var(--teal); color: var(--white); border-radius: var(--radius-xl); padding: 20px; display: grid; gap: 12px; }
    .login-card .hello { font-weight: 900; font-size: 18px; }
    .login-card .profile-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--white); display: flex; justify-content: center; align-items: center; }
    .login-card .profile-icon img { width: 40px; height: 32px; }
    .login-btn { background: var(--white); color: var(--ink); border-radius: 10px; padding: 12px; font-weight: 800; text-align: center; }
    .login-sub { display: flex; gap: 10px; font-size: 12px; opacity: .95; justify-content: center; }

    /* 하단 3컬럼 */
    .row-3 { display: grid; grid-template-columns: 0.8fr 0.6fr 0.6fr; gap: 18px; margin-top: 18px; }
    .roadmap { background: var(--teal); color: var(--white); border-radius: var(--radius-xl); padding: 18px; display: grid; grid-template-columns: 1fr; align-items: center; gap: 12px; }
    .roadmap .title { font-weight: 900; font-size: clamp(28px, 3.5vw, 48px); line-height: .95; }
    .roadmap .subtitle { font-size: 14px; opacity: .95; margin-bottom: 10px; }
    .quick, .subject { background: var(--gray-box); border-radius: var(--radius-xl); padding: 18px; display: grid; gap: 10px; align-content: space-between; }
    .quick .title, .subject .title { font-weight: 800; }
    .quick .btn, .subject .cta { justify-self: start; background: var(--teal); color: var(--white); border-radius: 12px; padding: 12px 18px; font-weight: 800; }

    /* 반응형 */
    @media (max-width: 1100px) {
      .top-bar { flex-wrap: wrap; }
      .search-area { order: 3; width: 100%; max-width: none; margin-top: 10px; }
    }
    @media (max-width: 980px) {
      .grid, .row-3 { grid-template-columns: 1fr; }
      .panel { grid-template-columns: 1fr; }
      .login-card { justify-self: stretch; }
    }
    @media (max-width: 768px) {
      .main-nav { flex-wrap: wrap; justify-content: center; }
      .tabs { order: 3; width: 100%; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; }
      .panel { grid-template-columns: 1fr; }
      .roadmap { grid-template-columns: 1fr; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top-bar">
        <a href="#" class="logo">
          <!-- # 사진 변경: 로고 이미지 경로를 로컬 파일로 교체 -->
          <img src="./Photo/로고.png" alt="uniMatch 로고" />
        </a>
        <div class="search-area">
          <form class="searchbar" onsubmit="return false;">
            <input type="search" placeholder="검색어를 입력해주세요" aria-label="검색" />
            <button type="submit">🔍</button>
          </form>
          <div class="chip">
            <!-- # 사진 변경: 챗봇 아이콘 로컬 파일로 교체 -->
            <img src="./Photo/chat_bot.png" alt="chat_bot 로고" />
          </div>
        </div>
        <nav class="auth-links">
          <a href="#">로그인</a>
          <span>|</span>
          <a href="#">회원가입</a>
          <span>|</span>
          <a href="#">유니맵</a>
        </nav>
      </div>

      <nav class="main-nav">
        <button class="burger" aria-label="메뉴 열기"><span></span></button>
        <div class="tabs">
          <a class="tab" href="#">학교별 탐색</a>
          <a class="tab active" href="#">학과별 탐색</a>
          <a class="tab" href="#">진학 로드맵</a>
          <a class="tab" href="#">My Path</a>
        </div>
        <a href="#" class="user-icon" aria-label="내 계정">
          <!-- # 사진 변경: 회원 아이콘 로컬 파일로 교체 -->
          <img src="./Photo/회원_아이콘.png" alt="사용자" />
        </a>
      </nav>
    </header>

    <main>
      <section class="grid">
        <div class="panel">
          <article class="card school-box">
            <!-- # 사진 변경: 돋보기+학교 아이콘 로컬 파일로 교체 -->
            <img src="./Photo/대학교_찾기.png" alt="학교 검색" style="width:110px;" />
            <button class="school-btn">학교별 탐색</button>
          </article>
          <article class="card center-hero">
            <div class="logo-row">
              <!-- # 사진 변경: 대학 로고들을 로컬 파일로 교체 -->
              <img src="./Photo/서울대_로고.png" alt="University 1" />
              <img src="./Photo/연세대_로고.png" alt="University 2" />
              <img src="./Photo/고려대_로고.png" alt="University 3" />
              <img src="./Photo/성균관대_로고.png" alt="University 4" />
            </div>
            <div class="hero-text">
              원하는 대학·학과,<br />필요한 과목 한눈에 확인하기
            </div>
          </article>
        </div>

        <aside class="login-card">
          <div class="hello">만나서 반가워요!</div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(0,0,0,0.1); border-radius:12px; padding:10px 15px;">
            <div class="profile-icon">
              <!-- # 사진 변경: 동그란 사용자 아이콘 로컬 파일로 교체 -->
              <img src="./Photo/회원_아이콘.png" alt="프로필 아이콘" />
            </div>
            <a href="#" class="login-btn">로그인</a>
          </div>
          <div class="login-sub">
            <a href="#">아이디 찾기</a>
            <span>|</span>
            <a href="#">비밀번호 찾기</a>
            <span>|</span>
            <a href="#">회원가입</a>
          </div>
        </aside>
      </section>

      <section class="row-3">
        <article class="roadmap">
          <div>
            <div class="subtitle">나만의 고교학점제 과목으로<br>진학 가능 대학/학과 알아보기</div>
            <div class="title">진학<br/>로드맵</div>
          </div>
        </article>

        <article class="quick">
          <div class="title">간편한 선택 지금바로 알아보기</div>
          <!-- # 사진 변경: 간편선택 일러스트 로컬 파일로 교체 -->
          <img src="./Photo/시스템_아이콘.png" alt="간편선택" style="border-radius:12px;" />
          <button class="btn">바로 가기</button>
        </article>

        <article class="subject">
          <div>
            <!-- # 사진 변경: 돋보기+모자 아이콘 로컬 파일로 교체 -->
            <img src="./Photo/학과_찾기.png" alt="학과 탐색" style="width:110px; height:80px; margin-bottom:10px;" />
            <div class="title">학과별, 학교 물어보기</div>
          </div>
          <button class="cta">학과별 탐색</button>
        </article>
      </section>
    </main>

    <footer style="margin:32px 0 16px; text-align:center; color:var(--muted); font-size:12px;">
      © 2025 uniMatch Mock • This is a static demo layout.
    </footer>
  </div>
